apiVersion: v1
kind: Service
metadata:
  name: event-service
  labels:
    app: event-service
spec:
  selector:
    app: event-service
  ports:
    - name: http
      protocol: TCP
      port: 4004
      targetPort: 4004

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: event-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: ghcr.io/shinjon101/ticketing-event-service:sha-c788fff
          ports:
            - containerPort: 4004
          envFrom:
            - configMapRef:
                name: event-service-config
            - secretRef:
                name: event-service-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Startup holds back the other two probes until the server is
          # listening (after DB, Kafka and the consumer group join), up to 2m.
          startupProbe:
            httpGet:
              path: /health/live
              port: 4004
            periodSeconds: 5
            failureThreshold: 24
          # Readiness may fail under load (pool saturated): the pod only stops
          # receiving traffic until it recovers.
          readinessProbe:
            httpGet:
              path: /health
              port: 4004
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness restarts the container, so it only checks that the event
          # loop answers at all, and tolerates ~2m of a CPU-starved pod.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4004
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
