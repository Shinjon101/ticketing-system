apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
data:
  01-init-databases.sh: |
    set -e

    provision_db_and_role() {
      local db="$1"
      local role="$2"
      local password="$3"
      local conn_limit="$4"

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        DO \$\$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${role}') THEN
            CREATE ROLE "${role}" WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE CONNECTION LIMIT ${conn_limit};
          ELSE
            ALTER ROLE "${role}" CONNECTION LIMIT ${conn_limit};
          END IF;
        END
        \$\$;
        ALTER ROLE "${role}" WITH PASSWORD '${password}';
    EOSQL

      if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = '${db}'" --username "$POSTGRES_USER" | grep -q 1; then
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE \"${db}\" OWNER \"${role}\";"
      fi

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        REVOKE CONNECT ON DATABASE "${db}" FROM PUBLIC;
        GRANT CONNECT ON DATABASE "${db}" TO "${role}";
    EOSQL

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "${db}" <<-EOSQL
        ALTER SCHEMA public OWNER TO "${role}";
    EOSQL
    }

    provision_db_and_role "auth_db"      "auth_user"      "${AUTH_DB_PASSWORD}"      25
    provision_db_and_role "event_db"     "event_user"     "${EVENT_DB_PASSWORD}"     25
    provision_db_and_role "booking_db"   "booking_user"   "${BOOKING_DB_PASSWORD}"   50
    provision_db_and_role "inventory_db" "inventory_user" "${INVENTORY_DB_PASSWORD}" 50
    provision_db_and_role "payment_db"   "payment_user"   "${PAYMENT_DB_PASSWORD}"   25

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      REVOKE CONNECT ON DATABASE postgres FROM PUBLIC;
    EOSQL