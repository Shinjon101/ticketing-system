apiVersion: batch/v1
kind: Job
metadata:
  name: payment-service-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: payment-service:local
          command: ["node", "dist/db/migrate.js"]
          envFrom:
            - secretRef: { name: payment-service-secrets }