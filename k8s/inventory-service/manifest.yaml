apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  labels:
    app: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
  - name: http
    protocol: TCP
    port: 4006
    targetPort: 4006


---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: ghcr.io/shinjon101/ticketing-inventory-service:sha-a6e7c97
          ports:
            - containerPort: 4006
          envFrom:
            - configMapRef:
                name: inventory-service-config
            - secretRef:
                name: inventory-service-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1500m"
              memory: "256Mi"
          # Startup holds back the other two probes until the server is
          # listening (after DB, Kafka and the consumer group join), up to 2m.
          startupProbe:
            httpGet:
              path: /health/live
              port: 4006
            periodSeconds: 5
            failureThreshold: 24
          # Readiness may fail under load (pool saturated): the pod only stops
          # receiving traffic until it recovers.
          readinessProbe:
            httpGet:
              path: /health
              port: 4006
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness restarts the container, so it only checks that the event
          # loop answers at all, and tolerates ~2m of a CPU-starved pod.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4006
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
