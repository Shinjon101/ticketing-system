apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-service-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/shinjon101/ticketing-inventory-service:latest
          imagePullPolicy: Always
          command: ["node", "dist/db/migrate.js"]
          envFrom:
            - secretRef: { name: inventory-service-secrets }