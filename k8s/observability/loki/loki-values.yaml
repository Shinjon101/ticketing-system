deploymentMode: SingleBinary

# Zero out the SimpleScalable components to satisfy Helm chart validation
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi
    storageClass: standard  

loki:
  auth_enabled: false

  server:
    http_listen_port: 3100

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 48h  # 2 days

  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

minio:
  enabled: false   # explicit — prevents provisioning unused MinIO pods