adminPassword: "admin" 

# 1. Automatically import dashboards from ConfigMaps tagged with grafana_dashboard: "1"
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL

# 2. Configure Prometheus and Loki datasources
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-operated.observability.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: 15s

      - name: Loki
        type: loki
        access: proxy
        url: http://loki-headless.observability.svc.cluster.local:3100
        isDefault: false
        jsonData:
          maxLines: 1000