apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-booking-service
  namespace: observability
  labels:
    grafana_dashboard: "1" # Sidecar detects this
data:
  booking-service.json: |
    {
      "title": "Booking Service Overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "panels": [
        {
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(http_requests_total{app=\"booking-service\"}[1m])) by (route, status_code)"
            }
          ]
        },
        {
          "title": "HTTP p95 Latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{app=\"booking-service\"}[5m])) by (le, route))"
            }
          ]
        },
        {
          "title": "Live Logs",
          "type": "logs",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "Loki" },
              "expr": "{container=\"booking-service\"}"
            }
          ]
        }
      ]
    }

---
# 2. System Logs Dashboard
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-system-logs
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  system-logs.json: |
    {
      "title": "System Logs",
      "timezone": "browser",
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": { "type": "loki", "uid": "Loki" },
            "query": "label_values(container)",
            "multi": true,
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" },
            "refresh": 2
          },
          {
            "name": "level",
            "type": "query",
            "datasource": { "type": "loki", "uid": "Loki" },
            "query": "label_values(level)",
            "multi": true,
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "title": "Log Volume by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "Loki" },
              "expr": "sum(rate({container=~\"$service\"}[1m])) by (container)"
            }
          ]
        },
        {
          "title": "All Logs",
          "type": "logs",
          "gridPos": { "h": 16, "w": 24, "x": 0, "y": 8 },
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "Loki" },
              "expr": "{container=~\"$service\", level=~\"$level\"}"
            }
          ]
        }
      ]
    }

