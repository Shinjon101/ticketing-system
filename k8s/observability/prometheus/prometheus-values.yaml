grafana:
  enabled: false  

defaultRules:
  create: false

alertmanager:
  enabled: false

kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false

kubelet:
  enabled: false
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

prometheus:
  prometheusSpec:
    retention: 3d
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    serviceMonitorSelectorNilUsesHelmValues: false  # without it, ServiceMonitorsre ignored
    podMonitorSelectorNilUsesHelmValues: false
    enableRemoteWriteReceiver: true