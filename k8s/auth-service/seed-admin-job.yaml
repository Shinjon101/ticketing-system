apiVersion: batch/v1
kind: Job
metadata:
  name: auth-service-seed-admin
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed-admin
          image: ghcr.io/shinjon101/ticketing-auth-service:latest
          imagePullPolicy: Always
          command: ["node", "dist/db/seed-admin.js"]
          envFrom:
            - secretRef: { name: auth-service-secrets }