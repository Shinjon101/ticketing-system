apiVersion: batch/v1
kind: Job
metadata:
  name: auth-service-seed-admin
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed-admin
          image: ghcr.io/shinjon101/ticketing-auth-service:sha-75f6084
          command: ["node", "dist/db/seed-admin.js"]
          envFrom:
            - secretRef: { name: auth-service-secrets }