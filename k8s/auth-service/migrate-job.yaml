apiVersion: batch/v1
kind: Job
metadata:
  name: auth-service-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: auth-service:local
          command: ["node", "dist/db/migrate.js"]
          envFrom:
            - secretRef: { name: auth-service-secrets }