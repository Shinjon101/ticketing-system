apiVersion: v1
kind: Service
metadata:
  name: booking-service
  labels:
    app: booking-service
spec:
  selector:
    app: booking-service
  ports:
    - name: http
      protocol: TCP
      port: 4005
      targetPort: 4005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: booking-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: ghcr.io/shinjon101/ticketing-booking-service:sha-c788fff
          ports:
            - containerPort: 4005
          envFrom:
            - configMapRef:
                name: booking-service-config
            - secretRef:
                name: booking-service-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1500m"
              memory: "256Mi"
          # Startup holds back the other two probes until the server is
          # listening (after DB, Kafka and the consumer group join), up to 2m.
          startupProbe:
            httpGet:
              path: /health/live
              port: 4005
            periodSeconds: 5
            failureThreshold: 24
          # Readiness may fail under load (pool saturated): the pod only stops
          # receiving traffic until it recovers.
          readinessProbe:
            httpGet:
              path: /health
              port: 4005
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness restarts the container, so it only checks that the event
          # loop answers at all, and tolerates ~2m of a CPU-starved pod.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4005
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6