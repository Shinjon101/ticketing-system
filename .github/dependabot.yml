version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/services/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns: ["*"]