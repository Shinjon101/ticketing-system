#V4

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "k8s/**"
      - "argocd/**"
      - ".github/dependabot.yml"
      - "load-tests/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        # version comes from "packageManager" in package.json
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:ci

      - name: Build shared packages
        run: |
          pnpm --filter @ticketing/common build
          pnpm --filter @ticketing/db build
          pnpm --filter @ticketing/kafka-client build

      - name: Typecheck
        run: |
          pnpm --filter @ticketing/common typecheck
          pnpm --filter @ticketing/db typecheck
          pnpm --filter @ticketing/kafka-client typecheck
          pnpm --filter @ticketing/auth-service typecheck
          pnpm --filter @ticketing/event-service typecheck
          pnpm --filter @ticketing/booking-service typecheck
          pnpm --filter @ticketing/inventory-service typecheck
          pnpm --filter @ticketing/payment-service typecheck

      - name: Generate throwaway JWT keypair
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/jwt.key"
          openssl pkey -in "$RUNNER_TEMP/jwt.key" -pubout -out "$RUNNER_TEMP/jwt.pub"
          {
            echo "JWT_PRIVATE_KEY<<EOF"; cat "$RUNNER_TEMP/jwt.key"; echo "EOF"
            echo "JWT_PUBLIC_KEY<<EOF"; cat "$RUNNER_TEMP/jwt.pub"; echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Run auth-service unit tests
        run: pnpm --filter @ticketing/auth-service test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db

      - name: Run inventory-service unit tests
        run: pnpm --filter @ticketing/inventory-service test

      - name: Run booking-service unit tests
        run: pnpm --filter @ticketing/booking-service test

      - name: Run payment-service unit tests
        run: pnpm --filter @ticketing/payment-service test

      - name: Run event-service unit tests
        run: pnpm --filter @ticketing/event-service test

      - name: Run inventory-service integration tests
        run: pnpm --filter @ticketing/inventory-service test:integration

      - name: Run booking-service integration tests
        run: pnpm --filter @ticketing/booking-service test:integration

      - name: Run payment-service integration tests
        run: pnpm --filter @ticketing/payment-service test:integration

      - name: Run event-service integration tests
        run: pnpm --filter @ticketing/event-service test:integration

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-24.04
    needs: validate
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - event-service
          - booking-service
          - inventory-service
          - payment-service

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Format repository owner
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.repo_owner.outputs.owner }}/ticketing-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          push: false
          tags: scan/${{ matrix.service }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.service }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push scanned image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SRC: scan/${{ matrix.service }}:${{ github.sha }}
        run: |
          while read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "$SRC" "$tag"
            docker push "$tag"
          done <<< "$TAGS"

  bump-manifests:
    name: Bump image tags
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Compute image tag
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Verify all 5 images exist at this tag
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for s in auth event booking inventory payment; do
            docker buildx imagetools inspect \
              "ghcr.io/${OWNER}/ticketing-${s}-service:${TAG}" > /dev/null \
              || { echo "::error::ticketing-${s}-service:${TAG} not found in GHCR"; exit 1; }
          done

      - name: Point manifests at this commit's images
        run: |
          REF='ghcr\.io/[a-z0-9-]+/ticketing-[a-z]+-service'
          bump() {
            grep -rlE --include='*.yaml' "${REF}:" k8s \
              | xargs -r sed -i -E "s#(${REF}):[A-Za-z0-9._-]+#\1:${TAG}#"
            total=$(grep -rhE --include='*.yaml' "${REF}:" k8s | wc -l)
            current=$(grep -rhE --include='*.yaml' "${REF}:${TAG}[[:space:]]*$" k8s | wc -l)
            [[ $total -gt 0 && $total -eq $current ]] \
              || { echo "::error::only ${current}/${total} image refs at ${TAG}"; exit 1; }
          }
          declare -f bump > /tmp/bump.sh   # reused by the retry below
          echo "REF='${REF}'" >> /tmp/bump.sh
          bump

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source /tmp/bump.sh

          for attempt in 1 2 3; do
            if git diff --quiet; then echo "already at ${TAG}"; exit 0; fi
            git commit -am "chore(deploy): bump service images to ${TAG} [skip ci]" \
                       -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt ${attempt}); re-applying on latest main"
            git fetch origin main && git reset --hard origin/main
            bump
          done
          echo "::error::could not push after 3 attempts"; exit 1