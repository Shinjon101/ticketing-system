#Continuous Integration workflow for the ticketing system, version:3.0.0
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.30.2 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @ticketing/common build
          pnpm --filter @ticketing/db build
          pnpm --filter @ticketing/kafka-client build

      - name: Typecheck
        run: |
          pnpm --filter @ticketing/common typecheck
          pnpm --filter @ticketing/db typecheck
          pnpm --filter @ticketing/kafka-client typecheck
          pnpm --filter @ticketing/auth-service typecheck
          pnpm --filter @ticketing/event-service typecheck
          pnpm --filter @ticketing/booking-service typecheck
          pnpm --filter @ticketing/inventory-service typecheck
          pnpm --filter @ticketing/payment-service typecheck

      - name: Run tests
        run: pnpm --filter @ticketing/auth-service test
        env:
          NODE_ENV: test
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db

      - name: Run inventory-service unit tests
        run: pnpm --filter @ticketing/inventory-service test

      - name: Run booking-service unit tests
        run: pnpm --filter @ticketing/booking-service test

      - name: Run payment-service unit tests
        run: pnpm --filter @ticketing/payment-service test

      #Integration tests via Testcontainers.

      - name: Run inventory-service integration tests
        run: pnpm --filter @ticketing/inventory-service test:integration

      - name: Run booking-service integration tests
        run: pnpm --filter @ticketing/booking-service test:integration

      - name: Run payment-service integration tests
        run: pnpm --filter @ticketing/payment-service test:integration

  #NOTE: event-service has no test suite yet (typecheck only)

  docker:
    name: Docker build (${{matrix.service}})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - event-service
          - booking-service
          - inventory-service
          - payment-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
# Lowercase repo owner to prevent invalid GHCR image naming format errors
      - name: Format repository owner
        id: repo_owner
        run: echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_owner.outputs.owner }}/ticketing-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
